<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Oso polar">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="64" cy="64" r="58" fill="url(#shadow)"/>

  <!-- head -->
  <circle cx="64" cy="68" r="44" fill="url(#fur)"/>

  <!-- ears -->
  <circle cx="32" cy="40" r="14" fill="url(#fur)"/>
  <circle cx="96" cy="40" r="14" fill="url(#fur)"/>
  <circle cx="32" cy="40" r="7" fill="#c7d2fe" opacity="0.45"/>
  <circle cx="96" cy="40" r="7" fill="#c7d2fe" opacity="0.45"/>

  <!-- snout -->
  <ellipse cx="64" cy="84" rx="26" ry="20" fill="#eef2ff"/>

  <!-- nose -->
  <path d="M64 74c-7 0-12 5-12 10 0 5 5 9 12 9s12-4 12-9c0-5-5-10-12-10z" fill="#0f172a"/>

  <!-- eyes -->
  <circle cx="48" cy="66" r="5" fill="#0f172a"/>
  <circle cx="80" cy="66" r="5" fill="#0f172a"/>
  <circle cx="46" cy="64" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="78" cy="64" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- mouth -->
  <path d="M56 92c3 5 9 8 8 8s5-3 8-8" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- little cheek shading -->
  <circle cx="38" cy="84" r="9" fill="#38bdf8" opacity="0.10"/>
  <circle cx="90" cy="84" r="9" fill="#38bdf8" opacity="0.10"/>
</svg>
