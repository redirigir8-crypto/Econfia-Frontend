<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta http-equiv="refresh" content="30" />
    <title>Econfia | Mantenimiento</title>
    <style>
      :root {
        --bg-a: #050812;
        --bg-b: #071827;
        --panel: rgba(9, 24, 39, 0.82);
        --panel-soft: rgba(13, 43, 62, 0.66);
        --border: rgba(77, 219, 221, 0.22);
        --text: #f5fbff;
        --muted: #a7b7c9;
        --cyan: #22d3ee;
        --green: #2dd4bf;
        --red: #ef233c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 28px;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 22%, rgba(239, 35, 60, 0.18), transparent 28%),
          radial-gradient(circle at 78% 20%, rgba(34, 211, 238, 0.18), transparent 30%),
          linear-gradient(135deg, var(--bg-a), var(--bg-b) 58%, #07111f);
      }

      body::before,
      body::after {
        position: fixed;
        inset: 0;
        content: "";
        pointer-events: none;
      }

      body::before {
        opacity: 0.2;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 84px 84px;
        mask-image: radial-gradient(circle at center, black, transparent 78%);
      }

      body::after {
        background:
          linear-gradient(120deg, transparent 0 35%, rgba(45, 212, 191, 0.08), transparent 64%),
          radial-gradient(circle at center, transparent 0 45%, rgba(0, 0, 0, 0.42));
      }

      .shell {
        position: relative;
        z-index: 1;
        width: min(860px, 100%);
        padding: 1px;
        border-radius: 30px;
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.32), rgba(45, 212, 191, 0.16), rgba(239, 35, 60, 0.2));
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.38);
      }

      .panel {
        min-height: 430px;
        padding: clamp(30px, 6vw, 58px);
        border-radius: 29px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background:
          linear-gradient(145deg, var(--panel), rgba(7, 17, 31, 0.94)),
          radial-gradient(circle at 80% 20%, rgba(34, 211, 238, 0.12), transparent 40%);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: clamp(38px, 7vw, 68px);
      }

      .mark {
        position: relative;
        width: 58px;
        height: 58px;
        flex: 0 0 auto;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
      }

      .mark::before,
      .mark::after {
        position: absolute;
        content: "";
        border-radius: 50%;
      }

      .mark::before {
        inset: 12px;
        border: 8px solid var(--red);
        border-right-color: transparent;
        transform: rotate(-26deg);
        filter: drop-shadow(0 0 14px rgba(239, 35, 60, 0.55));
      }

      .mark::after {
        inset: 21px;
        background: #ff3048;
        box-shadow: 0 0 20px rgba(239, 35, 60, 0.7);
      }

      .brand-title {
        margin: 0;
        letter-spacing: 0.28em;
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1;
      }

      .brand-subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
        padding: 10px 15px;
        border: 1px solid rgba(34, 211, 238, 0.28);
        border-radius: 999px;
        color: #bffcff;
        background: rgba(34, 211, 238, 0.08);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 rgba(45, 212, 191, 0.58);
        animation: pulse 1.8s infinite;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(36px, 8vw, 72px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .copy {
        max-width: 620px;
        margin: 26px 0 0;
        color: #c8d5e6;
        font-size: clamp(18px, 2.4vw, 22px);
        line-height: 1.7;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 38px;
      }

      .pill {
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        color: #dbeafe;
        background: var(--panel-soft);
        font-size: 13px;
        font-weight: 750;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.52);
        }
        70% {
          box-shadow: 0 0 0 12px rgba(45, 212, 191, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(45, 212, 191, 0);
        }
      }

      @media (max-width: 620px) {
        body {
          padding: 16px;
        }

        .panel {
          min-height: auto;
        }

        .brand {
          align-items: flex-start;
          flex-direction: column;
        }

        .brand-title {
          letter-spacing: 0.18em;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell" aria-labelledby="maintenance-title">
      <section class="panel">
        <div class="brand" aria-label="Econfia">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <p class="brand-title">ECONFIA</p>
            <p class="brand-subtitle">Una marca de Grupo Soluciones</p>
          </div>
        </div>

        <div class="status"><span class="pulse" aria-hidden="true"></span>Actualizacion en curso</div>
        <h1 id="maintenance-title">Econfia esta en mantenimiento</h1>
        <p class="copy">
          Estamos publicando una nueva version de la plataforma. El servicio volvera a estar disponible en unos minutos.
        </p>

        <div class="meta" aria-label="Informacion del estado">
          <span class="pill">La pagina se recarga automaticamente cada 30 segundos</span>
          <span class="pill">Codigo temporal: 500 / 502 / 503 / 504</span>
        </div>
      </section>
    </main>
  </body>
</html>
